# Nix supplies pnpm; fail rather than downloading another version.
pmOnFail: error
# Keep dependency installation explicit and the CI lockfile check read-only.
verifyDepsBeforeRun: error
# CI changes pnpm's default; clean devenv shells must use the same install layout.
enableGlobalVirtualStore: false

allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
overrides:
  js-yaml: 4.3.1
  nanoid: 3.3.18
  postcss: 8.5.26
  svgo: 4.0.2
minimumReleaseAgeExclude:
  - '@astrojs/internal-helpers@0.10.1 || 0.11.0'
  - '@astrojs/markdown-satteri@0.3.3 || 0.4.0'
  - astro@7.0.6 || 7.2.10
  - '@astrojs/cloudflare@14.2.6'
