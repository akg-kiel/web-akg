name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup mise
        uses: jdx/mise-action@v2
        with:
          cache: true

      - name: Run CI gate
        run: mise run ci

      - name: Install browser for accessibility and keyboard checks
        run: mise exec -- pnpm exec playwright-core install --with-deps chromium

      - name: Check built preview
        run: mise exec -- pnpm test:preview
